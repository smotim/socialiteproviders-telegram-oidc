name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            guzzle: '^7.16.1'
            testbench: '^9.0'
          - php: '8.3'
            guzzle: '^7.16.1'
            testbench: '^10.0'
          - php: '8.3'
            guzzle: '^8.0'
            testbench: '^11.0'
          - php: '8.4'
            guzzle: '^7.16.1'
            testbench: '^10.0'
          - php: '8.4'
            guzzle: '^8.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install the selected HTTP client and Laravel test environment
        run: >-
          composer update --no-interaction --no-progress --prefer-dist
          --with 'guzzlehttp/guzzle:${{ matrix.guzzle }}'
          --with 'orchestra/testbench:${{ matrix.testbench }}'

      - run: composer test
